# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public.
# Files in ./public are served as they are, before the Worker runs (free and not metered). src/worker.js only sees
# paths that are not files: the command-line version's installers, release files and share-link entry (see there).
name = "me2cloud"
main = "src/worker.js"
compatibility_date = "2025-01-01"
# Serve only on the bound custom domain: no *.workers.dev address and no per-version preview URLs
workers_dev = false
preview_urls = false

# No routes here: bind your own domain in the dashboard (Workers → Domains & Routes),
# or add `routes = [{ pattern = "example.com", custom_domain = true }]` locally.

[assets]
directory = "./public"
